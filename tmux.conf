# SETTINGS
set -g history-limit 50000

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256colour:RGB"

setw -g aggressive-resize on
set -g mouse on
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1

setw -g mode-keys vi
set -g set-clipboard on

# KEYBINDS
bind r source-file ~/.config/tmux/tmux.conf \; display " CONFIG RELOADED "

bind -n M-C-h split-window -h -c "#{pane_current_path}"
bind -n M-C-v split-window -v -c "#{pane_current_path}"

bind -n M-t new-window 
bind -n M-T break-pane

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-m  select-pane -m
bind -n M-s  swap-pane

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

bind -n M-z resize-pane -Z

bind -n M-Q kill-pane

bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-) join-pane -t :=0
bind -n M-! join-pane -t :=1
bind -n M-@ join-pane -t :=2
bind -n M-# join-pane -t :=3
bind -n M-$ join-pane -t :=4
bind -n M-% join-pane -t :=5
bind -n M-^ join-pane -t :=6
bind -n M-& join-pane -t :=7
bind -n M-* join-pane -t :=8
bind -n M-( join-pane -t :=9

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel "(wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel --clipboard 2>/dev/null)"

# STYLING
set -g status-style "fg=#ffffff,bg=#{?SSH_CONNECTION,#000032,#003200}"

set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#[fg=#ffbf00,bold] [#S] #[fg=#646464]| "
set -g status-right "#[fg=#646464] | #[fg=#00ff00] %Y-%m-%d %H:%M #(os-name) #{?window_zoomed_flag,#[fg=#ffffff bg=#600060][ZOOMED]#[default] ,}"

setw -g window-status-current-format "#[fg=#ffffff,bold][#I:#W]"
setw -g window-status-format "#[fg=#d0d0d0][#I:#W]"

set -g pane-active-border-style "fg=#00ff00"
set -g pane-border-style "fg=#006400"

set -g message-style "bg=#000000 fg=#ffbf00"
