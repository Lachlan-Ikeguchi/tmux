# SETTINGS
set -g history-limit 50000
set -g escape-time 10

set -g default-terminal "tmux-256color"
set -as terminal-features "alacritty:RGB"

setw -g aggressive-resize on
set -g mouse on
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g set-clipboard on

# KEYBINDS
bind r source-file ~/.config/tmux/tmux.conf \; display " CONFIG RELOADED "

bind -n M-V split-window -h -c "#{pane_current_path}"
bind -n M-H split-window -v -c "#{pane_current_path}"

bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-T break-pane

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-m select-pane -m
bind -n M-s swap-pane
bind -n M-r rotate-window

bind -n M-C-h resize-pane -L 5
bind -n M-C-j resize-pane -D 5
bind -n M-C-k resize-pane -U 5
bind -n M-C-l resize-pane -R 5

bind -n M-z resize-pane -Z

bind -n M-q kill-pane
bind -n M-Q switch-client -p \; kill-session

bind -n M-= choose-tree -s
bind -n M-+ command-prompt -p "Session name:" "new-session -A -s '%%'"

bind -n M-o select-window -t -
bind -n M-p select-window -t +

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-! join-pane -t :=1
bind -n M-@ join-pane -t :=2
bind -n M-# join-pane -t :=3
bind -n M-$ join-pane -t :=4
bind -n M-% join-pane -t :=5
bind -n M-^ join-pane -t :=6
bind -n M-& join-pane -t :=7
bind -n M-* join-pane -t :=8
bind -n M-( join-pane -t :=9

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# STYLING
set -g status-style "fg=#ffffff,bg=#{?SSH_CONNECTION,#000032,#003200}"

set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#[fg=#00ff00]<#{host}>#[fg=#ffbf00,bold] [#S] #[fg=#646464]| "
set -g status-right "#[fg=#646464] | #[fg=#00ff00] %Y-%m-%d %H:%M #(os-name) #{?window_zoomed_flag,#[fg=#ffffff bg=#600060][ZOOMED]#[default] ,}"

setw -g window-status-current-format "#[fg=#ffffff,bold][#I:#W]"
setw -g window-status-format "#[fg=#d0d0d0][#I:#W]"

set -g pane-active-border-style "fg=#00ff00"
set -g pane-border-style "fg=#006400"

set -g message-style "bg=#000000 fg=#ffbf00"
